# ⚠️ 这份文件不驱动本仓库的扫描 —— 别把它当成"扫描没跑"的依据。
# 本 fork 的扫描来自 SonarCloud GitHub App 的 **Automatic Analysis**：每个 PR / push 都会跑，
# 在 PR 上显示为 `SonarCloud Code Analysis` 检查，不需要 SONAR_TOKEN，
# `.github/workflows/quality.yml` 里也没有 sonar job。
# Automatic Analysis **不读取** sonar-project.properties；本文件是上游遗留，
# 且 projectKey 仍指向上游项目（GreenBeanICE/greenbean-study-assistant），
# 对本 fork 的 SonarCloud 项目（wenkais196-Gabriel_…）不起作用，删除不影响门禁。
# 覆盖率文件仍由 `npm run test:coverage:sonar` 产出（frontend lcov + python xml），供将来接 CI 用。
sonar.projectKey=GreenBeanICE_greenbean-study-assistant
sonar.organization=greenbeanice

sonar.projectName=Greenbean Study Assistant
sonar.projectVersion=0.1.0

sonar.sources=src,src-tauri/src,backend-python/app
sonar.tests=src,tests,backend-python/tests

sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  dist-ssr/**,\
  src-tauri/target/**,\
  backend-python/.venv/**,\
  backend-python/**/__pycache__/**,\
  coverage/**,\
  src/components/ui/**,\
  **/*.d.ts,\
  **/.gitkeep

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  **/*.spec.ts,\
  **/*.spec.tsx,\
  tests/**/*.ts,\
  tests/**/*.tsx,\
  backend-python/tests/**/*.py,\
  tests/**/*.rs,\
  **/tests/**/*.rs

sonar.javascript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.typescript.lcov.reportPaths=coverage/frontend/lcov.info
sonar.rust.lcov.reportPaths=coverage/rust/lcov.info
sonar.python.coverage.reportPaths=coverage/python/coverage.xml

sonar.sourceEncoding=UTF-8
